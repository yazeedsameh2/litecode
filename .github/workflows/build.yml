
name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: LiteCode-Windows
            artifact_path: '**/target/release/bundle/nsis/*.exe'
          - os: ubuntu-22.04
            bundles: deb
            artifact: LiteCode-Linux-Zorin
            artifact_path: '**/target/release/bundle/deb/*.deb'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: locate package.json
        shell: bash
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          archive = Path('litecode.zip')
          if not archive.is_file():
              raise SystemExit('ERROR: litecode.zip was not found in the repository root.')

          with zipfile.ZipFile(archive) as zf:
              zf.extractall('.')

          candidates = []
          for package in Path('.').rglob('package.json'):
              if 'node_modules' in package.parts:
                  continue
              root = package.parent
              if (root / 'src-tauri' / 'Cargo.toml').is_file():
                  candidates.append(root)

          if not candidates:
              print('Extracted files:')
              for path in list(Path('.').glob('*')):
                  print(f' - {path}')
              raise SystemExit(
                  'ERROR: Could not find a project directory containing both '
                  'package.json and src-tauri/Cargo.toml. Check the contents of litecode.zip.'
              )

          # Prefer the shallowest matching app root.
          root = min(candidates, key=lambda p: len(p.parts))
          relative = root.as_posix()
          if relative.startswith('./'):
              relative = relative[2:]

          print(f'Found LiteCode project at: {relative}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'LITECODE_DIR={relative}\n')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.LITECODE_DIR }}/src-tauri

      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm install
        working-directory: ${{ env.LITECODE_DIR }}

      - name: Generate Tauri icons
        run: npx tauri icon app-icon.png
        working-directory: ${{ env.LITECODE_DIR }}

      - name: Build Tauri app
        run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: ${{ env.LITECODE_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
