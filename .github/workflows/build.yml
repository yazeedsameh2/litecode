name: build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: LiteCode-Windows
            path: litecode/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundles: deb
            artifact: LiteCode-Linux-Zorin
            path: litecode/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        shell: bash
        run: python -c "import zipfile; zipfile.ZipFile('litecode.zip').extractall('.')"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: litecode/src-tauri
      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install
        working-directory: litecode
      - run: npx tauri icon app-icon.png
        working-directory: litecode
      - run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: litecode
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
